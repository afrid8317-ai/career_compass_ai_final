services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careercompass
      POSTGRES_USER: careercompass
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - careercompass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercompass -d careercompass"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  careercompass_pgdata:
